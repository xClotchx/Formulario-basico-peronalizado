<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="content">
    <div class="contenedor">
        <form action="" class="formulario"  >
            <h1>Formulario</h1>
    <label class="guia" >Ingrese su nombre</label><br>
    <input type="text" name="Nombre" class="Nombre" placeholder="Juan"> <br>
    <label class="guia" >Ingrese su ID</label><br>
    <input type="text" name="ID" class="ID" placeholder="x-xxx-xxxx" ><br>
    <label class="guia">Ingrese su anios de nacimiento </label><br>
    <input type="text" name="anios" class="anios" placeholder="22" ><br>
    <label class="guia">Ingrese su Ubicacion</label><br>
    <input type="text" name="Ubicacion" class="Ubicacion" placeholder="California" ><br>
    <label class="guia">Ingrese su Numero de Contacto</label><br>
    <input type="text" name="Contacto" class="Contacto" placeholder="+123 4567-8910" ><br>
    <label class="guia" >ingrese su e-mail</label><br>
    <input type="text" name="correo" class="correo" placeholder="example12@gmail.com" > <br>
    <br><br>
    <button class="btn" >Enviar</button>
    </form >
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
